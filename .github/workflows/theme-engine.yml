name: Validate ORCA Theme Engine
on:
  push:
    branches: [feature/orca-theme-studio-v2, fix/appearance-video-sidebar-v3, fix/video-per-tab-footer-theme, fix/universal-video-modes-no-fallback, fix/wms-settings-theme-coverage, fix/clean-duplicate-page-headings, main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Theme unit tests
        run: node --test --experimental-strip-types test/theme-studio.test.ts
      - name: Page heading regression tests
        run: node --test test/ui-page-headings.test.mjs
      - name: Consignment report role and Excel-column tests
        run: node --test --experimental-strip-types test/consignment-report-model.test.ts
      - name: Compact and Complete table view tests
        run: node --test --experimental-strip-types test/table-view-mode.test.ts
      - name: Accounts navigation regression tests
        run: node --test test/accounts-navigation.test.mjs
      - name: HRMS dashboard navigation regression tests
        run: node --test test/hrms-dashboard-navigation.test.mjs
      - name: Branch-wise Package Rate Excel validation tests
        run: node --test --experimental-strip-types test/package-rate-excel.test.ts
      - name: Transporter per-consignment charges regression tests
        run: node --test --experimental-strip-types test/transporter-charges.test.ts
      - name: Build
        run: npm run build
