name: Validate ORCA Theme Engine
on:
  push:
    branches: [feature/orca-theme-studio-v2, fix/appearance-video-sidebar-v3, main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Theme unit tests
        run: node --test --experimental-strip-types test/theme-studio.test.ts
      - name: Build
        run: npm run build
